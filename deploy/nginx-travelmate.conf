# /etc/nginx/sites-available/travelmate  (then link into sites-enabled)
# The YouTube bridge uses a WebSocket, so Upgrade headers are passed through.
server {
    listen 80;
    server_name _;            # replace with the domain once HTTPS is added
    client_max_body_size 20m; # photo search uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;  # EXAONE plan generation takes minutes
        proxy_send_timeout 600s;
    }
}
